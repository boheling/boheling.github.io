<title>Helix Field Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed WebGL viewport, floating instrument-console panels (workflows left, spec sheet right, run bar bottom). */
:root{
  --bg:#0b1117;
  --panel:rgba(13,20,27,.9);
  --panel-solid:#0f171e;
  --line:rgba(150,185,205,.16);
  --fg:#e3ebf0;
  --muted:#8b9dab;
  --accent:#f2a33a;
  --accent-ink:#1d1305;
  --cool:#5cc6d6;
  --ok:#5fd08f;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
#scene{position:fixed;inset:0;z-index:0}
#scene canvas{display:block;touch-action:none;outline:none}
#labels{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
button{font:inherit;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- device labels ---- */
.lbl{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;
  background:rgba(10,16,22,.78);border:1px solid var(--line);border-radius:999px;padding:2px 9px 2px 2px;
  cursor:pointer;white-space:nowrap;transform:translate(-50%,-50%);transition:opacity .2s,border-color .2s;font-size:12px}
.lbl b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#26323d;
  font:500 11px/1 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--fg)}
.lbl span{color:var(--fg);opacity:.9}
.lbl:hover,.lbl.on{border-color:var(--accent)}
.lbl.on b,.lbl.cur b{background:var(--accent);color:var(--accent-ink)}
.lbl.cur{border-color:var(--accent);box-shadow:0 0 0 3px rgba(242,163,58,.18)}
.lbl.dim{opacity:.22}
.lbl.compact span{display:none}
.lbl.compact{padding:2px}
.lbl.compact:hover span,.lbl.compact.on span,.lbl.compact.cur span{display:inline}
.lbl.compact:hover,.lbl.compact.on,.lbl.compact.cur{padding-right:9px}
body.nolabels .lbl{display:none}

/* ---- top bar ---- */
.topbar{position:fixed;z-index:5;top:12px;left:var(--gutter-l);right:var(--gutter-r);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;pointer-events:none}
.brand{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px 8px 10px;backdrop-filter:blur(10px)}
.brand svg{flex:none}
.brand h1{margin:0;font:700 21px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
.brand p{margin:3px 0 0;color:var(--muted);font:400 11.5px/1.2 var(--f-mono);letter-spacing:.02em}
.tools{pointer-events:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px;backdrop-filter:blur(10px)}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:500}
.seg button[aria-pressed="true"]{background:#24303b;color:var(--fg)}
.seg button:hover{color:var(--fg)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer;font-size:12.5px;font-weight:500;backdrop-filter:blur(10px)}
.btn:hover{border-color:rgba(242,163,58,.6)}
.btn[aria-pressed="true"]{color:var(--accent)}

/* ---- panels ---- */
.panel{position:fixed;z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(12px);
  display:flex;flex-direction:column;min-height:0;box-shadow:0 18px 50px rgba(0,0,0,.35)}
#left{left:var(--gutter-l);top:84px;width:330px;max-height:calc(100% - 100px)}
#info{right:var(--gutter-r);top:84px;width:370px;max-height:calc(100% - 100px)}
.tabs{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:7px;cursor:pointer;color:var(--muted);
  font:600 13px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.tabs button[aria-selected="true"]{background:#1e2933;color:var(--fg)}
.tabs .tg{flex:none;width:34px;font:500 14px/1 var(--f-mono);letter-spacing:0}
#left.collapsed .scroll{display:none}
#left.collapsed .tabs{border-bottom:0}
#left.collapsed .tabs button[aria-selected="true"]{background:transparent;color:var(--muted)}
body.zen #left, body.zen #info, body.zen .hint{display:none}
.scroll{overflow:auto;min-height:0;padding:12px;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:#26323d;border-radius:8px}

.wf-card{display:block;width:100%;text-align:left;background:#121c25;border:1px solid var(--line);border-radius:9px;padding:11px 12px;cursor:pointer;margin-bottom:8px}
.wf-card:hover{border-color:rgba(242,163,58,.55);background:#15212b}
.wf-card h3{margin:0 0 3px;font:600 17px/1.15 var(--f-display);letter-spacing:.01em}
.wf-card p{margin:0 0 8px;color:var(--muted);font-size:12.5px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font:500 11px/1 var(--f-mono);color:var(--fg);background:#1c2731;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-variant-numeric:tabular-nums}
.chip i{width:7px;height:7px;border-radius:50%;display:inline-block}
.intro-note{color:var(--muted);font-size:12px;margin:2px 2px 12px}

.wf-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.back{border:1px solid var(--line);background:#16212a;border-radius:7px;padding:5px 9px;cursor:pointer;font-size:12px;color:var(--muted)}
.back:hover{color:var(--fg)}
.wf-title{margin:4px 0 4px;font:700 22px/1.1 var(--f-display);text-wrap:balance}
.wf-blurb{margin:0 0 10px;color:var(--muted);font-size:13px}
ol.steps{list-style:none;margin:12px 0 0;padding:0;counter-reset:s;position:relative}
ol.steps li{position:relative;display:grid;grid-template-columns:26px 1fr;gap:10px;padding:8px 8px 8px 4px;border-radius:8px;cursor:pointer}
ol.steps li:hover{background:#15202a}
ol.steps li::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:24px;height:24px;border-radius:50%;
  border:1px solid #35424e;font:500 11px/1 var(--f-mono);color:var(--muted);background:var(--panel-solid);z-index:1}
ol.steps li::after{content:"";position:absolute;left:16px;top:32px;bottom:-8px;width:1px;background:#2b3742}
ol.steps li:last-child::after{display:none}
ol.steps li.done::before{background:#22303b;color:var(--fg);border-color:#4b5a67}
ol.steps li.cur{background:rgba(242,163,58,.1)}
ol.steps li.cur::before{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.st-a{font-weight:600;font-size:13.5px;line-height:1.25}
.st-d{color:var(--muted);font-size:12px;margin-top:2px}
.st-d em{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--cool)}
.st-x{font-size:12px;color:#b9c7d1;margin-top:4px;display:none}
ol.steps li.cur .st-x{display:block}

.eq-item{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-radius:8px;padding:7px 6px;cursor:pointer}
.eq-item:hover,.eq-item.on{background:#16212b}
.eq-item b{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;background:#1f2a34;font:500 11.5px/1 var(--f-mono)}
.eq-item.on b{background:var(--accent);color:var(--accent-ink)}
.eq-item .nm{font-weight:500;font-size:13.5px;line-height:1.2}
.eq-item .ct{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11.5px;margin-top:2px}
.eq-item .ct i{width:7px;height:7px;border-radius:50%}
.eq-group{font:600 11px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:12px 6px 4px}
.eq-group:first-child{margin-top:2px}

/* info panel */
.info-top{display:flex;align-items:flex-start;gap:12px;padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.info-num{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font:500 15px/1 var(--f-mono)}
.info-top h2{margin:2px 0 4px;font:700 23px/1.05 var(--f-display);text-wrap:balance}
.cat{display:inline-flex;align-items:center;gap:6px;font:500 11px/1 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cat i{width:7px;height:7px;border-radius:50%}
.close{margin-left:auto;flex:none;border:1px solid var(--line);background:#16212a;border-radius:7px;width:30px;height:30px;cursor:pointer;color:var(--muted);font-size:16px;line-height:1}
.close:hover{color:var(--fg)}
.info-body p.lead{margin:0 0 14px;font-size:13.5px;line-height:1.55;max-width:62ch}
.info-body h4{margin:16px 0 8px;font:600 12px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.info-body h4:first-of-type{margin-top:4px}
dl.specs{margin:0;display:grid;grid-template-columns:minmax(0,40%) minmax(0,1fr);border-top:1px solid var(--line)}
dl.specs dt,dl.specs dd{margin:0;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;min-width:0}
dl.specs dt{color:var(--muted);padding-right:10px}
dl.specs dd{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
ul.caps{margin:0;padding:0;list-style:none;display:grid;gap:6px}
ul.caps li{position:relative;padding-left:16px;font-size:13px}
ul.caps li::before{content:"";position:absolute;left:2px;top:7px;width:6px;height:6px;border:1.5px solid var(--cool);border-radius:1px;transform:rotate(45deg)}
.used{display:flex;flex-wrap:wrap;gap:6px}
.used button{cursor:pointer}
.used button:hover{border-color:var(--accent)}
.status-row{display:flex;align-items:center;gap:8px;margin:0 0 12px;font:500 11.5px/1 var(--f-mono);color:var(--ok)}
.status-row i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(95,208,143,.18);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}

/* run bar */
#runbar{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom, 0px));width:min(660px, calc(100% - 32px - 700px));min-width:420px;padding:12px 14px}
.rb-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font:500 11.5px/1 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.rb-top b{color:var(--accent);font-weight:500}
#rbTitle{margin:6px 0 2px;font:600 19px/1.15 var(--f-display)}
#rbDetail{color:#b9c7d1;font-size:12.5px;min-height:18px}
.rb-track{display:flex;gap:3px;margin:10px 0 10px}
.rb-track span{flex:1;height:5px;border-radius:3px;background:#24303a;position:relative;overflow:hidden;cursor:pointer}
.rb-track span.done{background:#5b6b78}
.rb-track span i{position:absolute;inset:0 auto 0 0;background:var(--accent);width:0}
.rb-ctrl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ib{display:grid;place-items:center;width:34px;height:32px;border-radius:8px;border:1px solid var(--line);background:#16212a;cursor:pointer}
.ib:hover{border-color:rgba(242,163,58,.6)}
.ib.play{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ib svg{width:15px;height:15px;fill:currentColor}
.spd{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:4px}
.spd button{border:0;background:#16212a;padding:7px 8px;cursor:pointer;font:500 11.5px/1 var(--f-mono);color:var(--muted)}
.spd button[aria-pressed="true"]{background:#26323d;color:var(--fg)}
.ib.voice[aria-pressed="true"]{color:var(--accent);border-color:rgba(242,163,58,.55)}
.ib.voice[aria-pressed="false"]{color:var(--muted)}
#rbSub{margin-top:6px;font-size:13.5px;line-height:1.5;color:var(--fg);min-height:20px}
#rbSub[hidden]{display:none}
#rbSub .said{color:var(--fg)}
#rbSub .todo{color:#6f8090}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-left:auto;cursor:pointer;user-select:none}
.chk input{accent-color:var(--accent)}
.rb-exit{border:1px solid var(--line);background:transparent;border-radius:8px;padding:7px 10px;cursor:pointer;font-size:12px;color:var(--muted)}
.rb-exit:hover{color:var(--fg)}

.hint{position:fixed;z-index:3;right:var(--gutter-r);bottom:calc(14px + env(safe-area-inset-bottom, 0px));color:var(--muted);font:400 11px/1.4 var(--f-mono);text-align:right;pointer-events:none;max-width:260px}
.hint b{color:var(--fg);font-weight:500}
#loading{position:fixed;inset:0;display:grid;place-items:center;z-index:10;background:var(--bg);font:500 12px var(--f-mono);color:var(--muted);transition:opacity .4s}

@media (max-width: 1180px){
  #runbar{width:auto;min-width:0;left:calc(var(--gutter-l) + 346px);right:var(--gutter-r);transform:none}
  .hint{display:none}
}
@media (max-width: 820px){
  .topbar{top:8px}
  .brand{padding:6px 10px}
  .brand h1{font-size:17px}
  .brand p{display:none}
  .seg button{padding:5px 8px;font-size:12px}
  .btn{padding:6px 9px;font-size:12px}
  #left{top:auto;left:var(--gutter-l);right:var(--gutter-r);width:auto;bottom:calc(10px + env(safe-area-inset-bottom, 0px));max-height:38%}
  #left.collapsed .scroll{display:none}
  #info{top:auto;left:var(--gutter-l);right:var(--gutter-r);width:auto;bottom:calc(10px + env(safe-area-inset-bottom, 0px));max-height:58%;z-index:6}
  #runbar{left:var(--gutter-l);right:var(--gutter-r);top:auto;bottom:calc(38% + 18px);transform:none;width:auto;min-width:0;padding:10px 12px}
  #runbar.lifted{bottom:calc(58px + env(safe-area-inset-bottom, 0px))}
  .chk span{display:none}
}
@media (prefers-reduced-motion: reduce){ .status-row i{animation:none} }
</style>

<div id="scene"></div>
<div id="labels"></div>
<div id="loading">Loading 3D lab…</div>

<header class="topbar">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="8" fill="#16212a" stroke="#2c3a46"/><path d="M11 6c0 7 12 8 12 14s-12 7-12 8M23 6c0 7-12 8-12 14s12 7 12 8" stroke="#f2a33a" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M13 10h8M12.5 17h9M13 24h8" stroke="#5cc6d6" stroke-width="1.6" stroke-linecap="round"/></svg>
    <div>
      <h1>Helix Field Lab</h1>
      <p>Automated molecular lab · 9.6 m class C RV · 16 systems</p>
    </div>
  </div>
  <div class="tools">
    <div class="seg" role="group" aria-label="View mode">
      <button id="mCut" aria-pressed="true" title="Open roof and the wall facing you">Cutaway</button>
      <button id="mX" aria-pressed="false" title="See-through shell, solar and battery visible">X-ray</button>
      <button id="mExt" aria-pressed="false" title="Closed vehicle">Exterior</button>
    </div>
    <button class="btn" id="bLabels" aria-pressed="true">Labels</button>
    <button class="btn" id="bSpin" aria-pressed="false">Orbit</button>
    <button class="btn" id="bZen" aria-pressed="false" title="Hide side panels (H)">Hide panels</button>
    <button class="btn" id="bReset">Reset view</button>
  </div>
</header>

<aside id="left" class="panel" aria-label="Workflows and equipment">
  <div class="tabs" role="tablist">
    <button role="tab" id="tWf" aria-selected="true">Workflows</button>
    <button role="tab" id="tEq" aria-selected="false">Equipment</button>
    <button class="tg" id="tCol" aria-label="Collapse panel" title="Collapse panel">–</button>

</aside>

<aside id="info" class="panel" hidden aria-live="polite">
  <div class="info-top">
    <div class="info-num" id="iNum">01</div>
    <div style="min-width:0">
      <h2 id="iName"></h2>
      <span class="cat" id="iCat"></span>
    </div>
    <button class="close" id="iClose" aria-label="Close details">✕</button>
  </div>
  <div class="scroll info-body" id="iBody"></div>
</aside>

<section id="runbar" class="panel" hidden aria-label="Workflow playback">
  <div class="rb-top"><span id="rbCount">STEP 1 / 12</span><span><b id="rbTime">10 min</b> real time · <span id="rbDev"></span></span></div>
  <div id="rbTitle"></div>
  <div id="rbDetail"></div>
  <div id="rbSub" lang="zh-CN" hidden></div>
  <div class="rb-track" id="rbTrack"></div>
  <div class="rb-ctrl">
    <button class="ib" id="bPrev" aria-label="Previous step"><svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg></button>
    <button class="ib play" id="bPlay" aria-label="Pause"><svg viewBox="0 0 16 16" id="playIco"><path d="M4 2h3v12H4zM9 2h3v12H9z"/></svg></button>
    <button class="ib" id="bNext" aria-label="Next step"><svg viewBox="0 0 16 16"><path d="M11 2h2v12h-2zM2 2v12l8-6z"/></svg></button>

      <button data-s="0.5" aria-pressed="false">0.5×</button>
      <button data-s="1" aria-pressed="true">1×</button>
      <button data-s="2" aria-pressed="false">2×</button>
    </div>
    <div class="spd" id="voiceSel" role="group" aria-label="Narration" title="Narration (V)">
      <button data-v="off" aria-pressed="true" aria-label="Narration off"><svg viewBox="0 0 16 16" width="13" height="13" style="vertical-align:-2px;fill:currentColor"><path d="M2 6h3l4-3v10l-4-3H2z"/><path d="M11 6l4 4M15 6l-4 4" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg></button>
      <button data-v="en" aria-pressed="false">EN</button>
      <button data-v="zh" aria-pressed="false" lang="zh-CN">中文</button>
    </div>
    <label class="chk"><input type="checkbox" id="cFollow" checked> <span>Follow camera</span></label>
    <button class="rb-exit" id="bExit">Exit</button>
  </div>
</section>

<div class="hint"><b>Drag</b> rotate · <b>Scroll</b> zoom · <b>Right-drag</b> pan<br>Click any instrument for its spec sheet</div>

(function(){
'use strict';
/* =========================================================
   DATA
   ========================================================= */
const CATS = {
  'Sample management':'#8fd8ff',
  'Sample prep':'#9fe6b0',

  'Amplification':'#ff8f7a',
  'Quality control':'#c7a6ff',
  'Sequencing':'#5cc6d6',
  'Analytical chemistry':'#ffd36b',
  'Data & analysis':'#7aa7ff',

};
const DEVICES = [
 {id:'cold', name:'Cold Chain Storage', cat:'Sample management',
  intro:'An upright −80 °C freezer and a 4 °C reagent refrigerator mounted against the rear bulkhead on vibration isolators. They hold incoming specimens, extracted nucleic acids, enzymes and sequencing kits for multi-week deployments.',
  specs:[['Freezer range','−86 to −40 °C'],['Fridge range','2 to 8 °C'],['Capacity','2 × 120 L (≈ 10,000 × 2 mL tubes)'],['Hold-over','8 h above −70 °C with power off'],['Power','350 W average, inverter-fed'],['Monitoring','Dual probes, door sensors, satcom alarms']],
  caps:['Barcode-indexed rack positions','Continuous temperature log for chain of custody','Alarm escalation over satcom','Dry-ice backup compartment']},
 {id:'bsc', name:'Biosafety Cabinet', cat:'Sample management',

  const cw = res, ch = Math.max(16, Math.round(res*h/w));
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const ctx = c.getContext('2d');

  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({map:tex, toneMapped:false}));
  mesh.position.set(x,y,z); p.add(mesh);
  const s = {ctx, tex, w:cw, h:ch, draw, mesh}; screens.push(s);
  draw(ctx, 0, cw, ch); tex.needsUpdate = true; return s;
}

function tcTemp(t){
  const p = ((t % 3.6) + 3.6) % 3.6;
  if(p < 0.3) return lerp(72, 95, p/0.3);
  if(p < 1.0) return 95;
  if(p < 1.4) return lerp(95, 60, (p-1.0)/0.4);
  if(p < 2.2) return 60;
  if(p < 2.4) return lerp(60, 72, (p-2.2)/0.2);
  return 72;
}

const narr = { lang:'off', state:'off', doneT:0, text:'', token:0, ctx:null, src:null, buf:null, startAt:0, el:null, cache:{} };
const narrRate = () => speed >= 2 ? 1.15 : 1;
function audioCtx(){ // create or resume inside a user gesture
  try { if(!narr.ctx) narr.ctx = new (window.AudioContext || window.webkitAudioContext)(); if(narr.ctx.state === 'suspended' && playing) narr.ctx.resume(); } catch(e){}
  return narr.ctx;
}
const clipUrl = (lang, id, i) => 'audio/' + (lang === 'en' ? 'en-' : '') + id + '-' + i + '.mp3';
function loadClip(url){
  if(!narr.cache[url]) narr.cache[url] = fetch(url).then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
    .then(ab => new Promise((res, rej) => audioCtx().decodeAudioData(ab, res, rej)))
    .catch(err => { delete narr.cache[url]; throw err; });
  return narr.cache[url];
}
function narrDone(tok){ if(tok === narr.token && narr.state === 'playing'){ narr.state = 'done'; narr.doneT = stepT; } }
function narrFail(tok, why){ if(tok !== narr.token) return; narr.state = 'failed'; console.warn('[narration]', why);
  const el = document.getElementById('rbSub'); if(el && !el.hidden){ lastSub = -1; } }
narr.progress = () => {
  if(narr.src && narr.buf && narr.ctx) return clamp((narr.ctx.currentTime - narr.startAt)*narrRate()/narr.buf.duration, 0, 1);
  if(narr.el && isFinite(narr.el.duration) && narr.el.duration > 0) return clamp(narr.el.currentTime/narr.el.duration, 0, 1);
  return 0;
};
narr.pause = () => { if(narr.ctx && narr.ctx.state === 'running') narr.ctx.suspend(); if(narr.el) narr.el.pause(); };
narr.resume = () => { if(narr.ctx && narr.ctx.state === 'suspended') narr.ctx.resume(); if(narr.el && narr.state === 'playing') narr.el.play().catch(() => {}); };
narr.setRate = () => { if(narr.src) narr.src.playbackRate.value = narrRate(); if(narr.el) narr.el.playbackRate = narrRate(); };
function stopNarr(){
  narr.token++; narr.state = 'off';
  if(narr.src){ try { narr.src.onended = null; narr.src.stop(); } catch(e){} narr.src = null; }
  if(narr.el){ narr.el.pause(); narr.el.onended = narr.el.onerror = null; narr.el = null; }
  narr.buf = null;
}
function startClip(tok, url){
  const ctx = audioCtx();
  loadClip(url).then(buf => {
    if(tok !== narr.token) return;
    const src = ctx.createBufferSource(); src.buffer = buf; src.playbackRate.value = narrRate(); src.connect(ctx.destination);
    src.onended = () => narrDone(tok);
    narr.src = src; narr.buf = buf; narr.startAt = ctx.currentTime; src.start();
    if(!playing) ctx.suspend(); else if(ctx.state === 'suspended') ctx.resume();
  }).catch(err => { // file:// pages cannot fetch: fall back to a media element
    if(tok !== narr.token) return;
    const el = new Audio(url); narr.el = el; el.playbackRate = narrRate();
    el.onended = () => narrDone(tok); el.onerror = () => narrFail(tok, 'cannot load ' + url + ' (' + err.message + ')');
    if(playing) el.play().catch(e => narrFail(tok, e.message));

}
function playNarr(){
  stopNarr(); const book = NARR[narr.lang]; narr.text = (wf && book && book[wf.id] && book[wf.id][stepIdx]) || '';

  if(stepIdx + 1 < wf.steps.length) loadClip(clipUrl(narr.lang, wf.id, stepIdx + 1)).catch(() => {});

  const xr = m === 'xray';
  shellMats.forEach(mt => { const b = mt.userData.sb;
    if(xr){ mt.transparent = true; mt.opacity = 0.09; mt.depthWrite = false; } else { mt.transparent = b.tr; mt.opacity = b.op; mt.depthWrite = b.dw; }
    mt.needsUpdate = true; });
  shellG.traverse(o => { if(o.isMesh) o.castShadow = !xr; });
  Object.values(SH).forEach(g => g.visible = true);

  DEV.power.solar.visible = m !== 'cutaway';
  { const pm = DEV.power.solarMat, b = pm.userData.b;

    DEV.power.solar.traverse(o => { if(o.isMesh) o.castShadow = !xr; }); }

function applyDim(){
  DEVICES.forEach(d => { const b = DEV[d.id]; const dim = wfDevs && !wfDevs.has(d.id);
    b.dim = !!dim;
    b.mats.forEach(m => { const o = m.userData.b; if(m.userData.hit) return;
      if(dim){ m.transparent = true; m.opacity = o.op*0.13; m.depthWrite = false; } else { m.transparent = o.tr; m.opacity = o.op; m.depthWrite = o.dw; }
      m.needsUpdate = true; });
    b.g.traverse(o => { if(o.isMesh) o.castShadow = !dim && !o.material.transparent; });
  });
}

const ACC = new THREE.Color(0xf2a33a), _c = new THREE.Color();
function applyGlow(t){
  const cur = wf ? wf.steps[stepIdx].d : null;
  DEVICES.forEach(d => { const b = DEV[d.id]; let k = 0;
    if(S.hover === d.id) k = 0.16;
    if(S.selected === d.id) k = Math.max(k, 0.14 + 0.06*Math.sin(t*3));
    if(cur === d.id) k = Math.max(k, 0.2 + 0.12*Math.sin(t*4));
    if(Math.abs(k - b.lastK) < 0.004) return; b.lastK = k;
    b.mats.forEach(m => { if(!m.emissive || !m.userData.b.em) return; m.emissive.copy(m.userData.b.em).add(_c.copy(ACC).multiplyScalar(k)); });
  });
}

/* camera tween */
let tw = null;
function tweenTo(tgt, pos, dur){ tw = {t0:performance.now(), dur:(dur||1.1)*1000, fT:controls.target.clone(), fP:camera.position.clone(), tT:tgt.clone(), tP:pos.clone()}; }
function flyTo(id, far){
  const b = DEV[id]; const f = focusW(id);
  const dir = b.faceW.clone().multiplyScalar(1).add(new THREE.Vector3(0.28, far ? 1.0 : 0.78, 0)).normalize();
  const ins = panelInsets(), w = window.innerWidth, h = window.innerHeight;
  const crowd = Math.max(w/Math.max(200, w - ins.L - ins.R), h/Math.max(200, h - ins.T - ins.B));
  let dist = b.dist * (narrow() ? 1.45 : 1) * Math.pow(crowd, 0.8);
  if(far) dist = Math.max(dist*1.6, 3.4);
  tweenTo(f, f.clone().add(dir.multiplyScalar(dist)));
}
controls.addEventListener('start', () => { tw = null; });

/* keep the scene centred in the area not covered by panels */
function panelInsets(){
  const w = window.innerWidth, h = window.innerHeight; const o = {L:0, R:0, T:64, B:0};
  ['#left','#info','#runbar'].forEach(sel => { const el = document.querySelector(sel); if(!el || el.hidden) return;
    const r = el.getBoundingClientRect(); if(r.width === 0 || r.height === 0) return;
    if(r.width > w*0.6 || (r.left > w*0.2 && r.right < w*0.8)) o.B = Math.max(o.B, h - r.top + 8);
    else if(r.height < h*0.25) return;
    else if(r.left < w*0.4) o.L = Math.max(o.L, r.right + 8);
    else o.R = Math.max(o.R, w - r.left + 8); });
  return o;
}
const VO = {x:0, y:0, sx:null, sy:null};
function updateViewOffset(dt){
  const w = sceneEl.clientWidth || window.innerWidth, h = sceneEl.clientHeight || window.innerHeight;
  const ins = panelInsets();
  const tx = -(ins.L - ins.R)/2, ty = -(ins.T - ins.B)/2;
  const k = 1 - Math.exp(-dt*5); VO.x = lerp(VO.x, tx, k); VO.y = lerp(VO.y, ty, k);
  const rx = Math.round(VO.x), ry = Math.round(VO.y);
  if(rx !== VO.sx || ry !== VO.sy || camera.view === null || camera.view.fullWidth !== w || camera.view.fullHeight !== h){
    VO.sx = rx; VO.sy = ry; camera.setViewOffset(w, h, rx, ry, w, h); }
}

let pathMesh = null, segs = [];
const dashC = document.createElement('canvas'); dashC.width = 64; dashC.height = 4;
(function(){ const k = dashC.getContext('2d'); k.clearRect(0,0,64,4); k.fillStyle = '#ffffff'; k.fillRect(0,0,38,4); })();
const dashTex = new THREE.CanvasTexture(dashC); dashTex.wrapS = THREE.RepeatWrapping;
const pathMat = new THREE.MeshBasicMaterial({map:dashTex, color:0xffb547, transparent:true, opacity:.95, depthWrite:false, toneMapped:false});
const puck = new THREE.Group(); scene.add(puck); puck.visible = false;
puck.add(new THREE.Mesh(new THREE.SphereGeometry(0.045, 20, 14), MB(0xffc46b)));
const halo = new THREE.Mesh(new THREE.SphereGeometry(0.09, 20, 14), MB(0xf2a33a, {transparent:true, opacity:.25, depthWrite:false})); puck.add(halo);
const puckLight = new THREE.PointLight(0xffb547, 0.8, 1.6); puck.add(puckLight);

function clearPath(){ if(pathMesh){ scene.remove(pathMesh); pathMesh.geometry.dispose(); pathMesh = null; } segs = []; }
function buildPath(){
  clearPath();
  const pts = wf.steps.map(s => anchorW(s.d));
  const cp = new THREE.CurvePath();
  for(let i = 1; i < pts.length; i++){
    const a = pts[i-1], b = pts[i];
    if(a.distanceTo(b) < 0.05){ segs[i] = null; continue; }
    const mid = a.clone().add(b).multiplyScalar(0.5);
    mid.y = Math.max(a.y, b.y) + 0.3 + a.distanceTo(b)*0.06; mid.z *= 0.25;
    const c = new THREE.QuadraticBezierCurve3(a.clone(), mid, b.clone()); segs[i] = c; cp.add(c);
  }
  if(cp.curves.length){
    const geo = new THREE.TubeGeometry(cp, cp.curves.length*48, 0.011, 6, false);
    pathMesh = new THREE.Mesh(geo, pathMat); pathMesh.renderOrder = 5; scene.add(pathMesh);
    dashTex.repeat.x = cp.getLength()*7;
  }
}

function startWorkflow(id){
  wf = WORKFLOWS.find(w => w.id === id);
  wfDevs = new Set(wf.steps.map(s => s.d)); wfDevs.add('arm');
  if(S.mode !== 'cutaway') setMode('cutaway');
  finished = false; buildPath(); applyDim(); puck.visible = true;
  if(S.selected) closeInfo();
  renderLeft(); buildTrack();
  document.getElementById('runbar').hidden = false;
  setCollapsed(true);
  setPlaying(true); audioCtx(); setStep(0);
}
function stopWorkflow(){
  stopNarr();
  wf = null; wfDevs = null; clearPath(); applyDim(); puck.visible = false; playing = false;
  document.getElementById('runbar').hidden = true; renderLeft(); syncLabels();
  setCollapsed(false);
}
function setStep(i){
  stepIdx = clamp(i, 0, wf.steps.length - 1); stepT = (i === 0 || !segs[stepIdx]) ? TRAVEL : 0; finished = false;
  const s = wf.steps[stepIdx]; const b = DEV[s.d];
  if(s.d !== 'power'){ const p = b.g.position; DEV.arm.setTarget(s.d === 'cold' ? -3.85 : p.x, s.d === 'cold' ? -1 : (p.z < 0 ? -1 : 1), true); }
  if(S.follow) flyTo(s.d, true);
  playNarr();
  updateRunUI(); syncLabels(); highlightStepList();
}
function setPlaying(p){
  playing = p;
  if(p){ audioCtx(); narr.resume(); } else narr.pause(); const b = document.getElementById('bPlay');
  b.setAttribute('aria-label', p ? 'Pause' : 'Play');
  document.getElementById('playIco').innerHTML = p ? '<path d="M4 2h3v12H4zM9 2h3v12H9z"/>' : '<path d="M4 2v12l10-6z"/>';
}
function tickWorkflow(dt, t){
  if(!wf) return;
  if(playing){ stepT += dt*speed;
    const ready = narr.state === 'playing' ? false : narr.state === 'done' ? stepT >= Math.max(MIN_NARRATED, narr.doneT + HOLD) : stepT >= STEP_DUR;
    if(ready){ if(stepIdx < wf.steps.length - 1) setStep(stepIdx + 1); else { stepT = STEP_DUR; setPlaying(false); finished = true; updateRunUI(); } } }
  const seg = segs[stepIdx];
  if(seg && stepT < TRAVEL){ const u = stepT/TRAVEL; const e = u < .5 ? 2*u*u : 1 - Math.pow(-2*u + 2, 2)/2; puck.position.copy(seg.getPoint(e)); }
  else { puck.position.copy(anchorW(wf.steps[stepIdx].d)); puck.position.y += 0.04*Math.sin(t*3); }
  halo.scale.setScalar(1 + 0.25*Math.sin(t*5));
  dashTex.offset.x -= dt*0.9*speed;
  let frac;
  if(narr.state === 'playing') frac = 0.85*narr.progress();
  else if(narr.state === 'done') frac = 0.85 + 0.15*clamp((stepT - narr.doneT)/HOLD, 0, 1);
  else frac = Math.min(1, stepT/STEP_DUR);
  const fillEl = document.querySelector('#rbTrack span.cur i'); if(fillEl) fillEl.style.width = (frac*100).toFixed(1) + '%';
  renderSub();
}

let leftTab = 'wf';
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderLeft(){
  $('#tWf').setAttribute('aria-selected', String(leftTab === 'wf'));
  $('#tEq').setAttribute('aria-selected', String(leftTab === 'eq'));
  if(leftTab === 'eq'){
    const groups = {};
    DEVICES.forEach(d => (groups[d.cat] = groups[d.cat] || []).push(d));
    leftBody.innerHTML = Object.keys(CATS).filter(c => groups[c]).map(c =>
      `<div class="eq-group">${esc(c)}</div>` + groups[c].map(d =>
        `<button class="eq-item${S.selected === d.id ? ' on' : ''}" data-dev="${d.id}"><b>${pad(d.n)}</b><span><div class="nm">${esc(d.name)}</div><div class="ct"><i style="background:${CATS[d.cat]}"></i>${wfCount(d.id)} workflow${wfCount(d.id) === 1 ? '' : 's'}</div></span></button>`).join('')
    ).join('');
    return;
  }
  if(!wf){
    leftBody.innerHTML = `<p class="intro-note">Pick a workflow to watch a sample move through the lab. Instruments it does not use fade out.</p>` +
      WORKFLOWS.map(w => `<button class="wf-card" data-wf="${w.id}"><h3>${esc(w.name)}</h3><p>${esc(w.blurb)}</p>
        <div class="meta"><span class="chip">TAT ${esc(w.tat)}</span><span class="chip">${w.steps.length} steps</span><span class="chip">${new Set(w.steps.map(s => s.d)).size} instruments</span></div></button>`).join('');
    return;
  }
  leftBody.innerHTML = `<div class="wf-head"><button class="back" id="wfBack">← All workflows</button></div>
    <h3 class="wf-title">${esc(wf.name)}</h3><p class="wf-blurb">${esc(wf.blurb)}</p>
    <div class="meta"><span class="chip">TAT ${esc(wf.tat)}</span><span class="chip">${esc(wf.samples)}</span></div>
    <ol class="steps">${wf.steps.map((s, i) => `<li data-step="${i}"><div><div class="st-a">${esc(s.a)}</div>
      <div class="st-d">#${pad(DMAP[s.d].n)} ${esc(DMAP[s.d].name)} · <em>${esc(s.t)}</em></div><div class="st-x">${esc(s.x)}</div></div></li>`).join('')}</ol>`;
  highlightStepList();
}
function wfCount(id){ return id === 'arm' ? WORKFLOWS.length : WORKFLOWS.filter(w => w.steps.some(s => s.d === id)).length; }
function highlightStepList(){
  if(!wf) return;
  leftBody.querySelectorAll('ol.steps li').forEach((li, i) => { li.classList.toggle('cur', i === stepIdx); li.classList.toggle('done', i < stepIdx); });
  const cur = leftBody.querySelector('ol.steps li.cur'); if(cur && leftTab === 'wf') cur.scrollIntoView({block:'nearest', behavior:'smooth'});
}
leftBody.addEventListener('click', e => {
  const c = e.target.closest('[data-wf]'); if(c){ startWorkflow(c.dataset.wf); return; }
  if(e.target.closest('#wfBack')){ stopWorkflow(); return; }
  const st = e.target.closest('[data-step]'); if(st){ setStep(+st.dataset.step); return; }
  const dv = e.target.closest('[data-dev]'); if(dv){ select(dv.dataset.dev); if(narrow()) setCollapsed(true); }
});
function setCollapsed(c){ $('#left').classList.toggle('collapsed', c); const b = $('#tCol'); b.textContent = c ? '+' : '–'; b.setAttribute('aria-label', c ? 'Expand panel' : 'Collapse panel'); b.title = b.getAttribute('aria-label'); if(!c) highlightStepList(); }
$('#tWf').onclick = () => { leftTab = 'wf'; setCollapsed(false); renderLeft(); };
$('#tEq').onclick = () => { leftTab = 'eq'; setCollapsed(false); renderLeft(); };
$('#tCol').onclick = () => setCollapsed(!$('#left').classList.contains('collapsed'));

function buildTrack(){
  $('#rbTrack').innerHTML = wf.steps.map((s, i) => `<span data-i="${i}" title="${esc(s.a)}"><i></i></span>`).join('');
}
let lastSub = -1;
function renderSub(){
  const el = document.getElementById('rbSub'); if(!wf || el.hidden) return;
  if(narr.state === 'failed'){ if(lastSub !== -2){ lastSub = -2; el.innerHTML = '<span class="todo">' + (narr.lang === 'zh' ? '讲解音频加载失败。' : 'Narration audio could not load.') + '</span>'; } return; }
  const t = narr.text || '';
  let n = t.length;
  if(narr.state === 'playing') n = Math.round(t.length*narr.progress());
  if(n === lastSub) return; lastSub = n;
  el.innerHTML = '<span class="said">' + esc(t.slice(0, n)) + '</span><span class="todo">' + esc(t.slice(n)) + '</span>';
}
function setVoice(lang){
  narr.lang = lang; if(lang !== 'off') audioCtx();
  document.querySelectorAll('#voiceSel button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === lang)));
  if(!wf) return;
  if(lang !== 'off'){ const keep = stepT; playNarr(); stepT = keep; } else { stopNarr(); narr.text = ''; }
  updateRunUI();
}
document.querySelectorAll('#voiceSel button').forEach(b => b.onclick = () => setVoice(b.dataset.v));
setVoice('off'); // narration is opt-in
$('#rbTrack').addEventListener('click', e => { const s = e.target.closest('[data-i]'); if(s) setStep(+s.dataset.i); });
function updateRunUI(){
  if(!wf) return; const s = wf.steps[stepIdx], d = DMAP[s.d];
  $('#rbCount').textContent = finished ? 'COMPLETE · ' + wf.steps.length + ' STEPS' : `STEP ${stepIdx + 1} / ${wf.steps.length}`;
  $('#rbTime').textContent = s.t; $('#rbDev').textContent = '#' + pad(d.n) + ' ' + d.name;
  $('#rbTitle').textContent = finished ? 'Workflow complete. Results delivered.' : s.a;
  const showSub = narr.lang !== 'off' && !finished && !!narr.text;
  $('#rbSub').setAttribute('lang', narr.lang === 'zh' ? 'zh-CN' : 'en');
  $('#rbSub').hidden = !showSub; $('#rbDetail').hidden = showSub; lastSub = -1; renderSub();
  $('#rbDetail').textContent = finished ? `${wf.name}: total turnaround ${wf.tat}. Press play to replay.` : s.x;
  $('#rbTrack').querySelectorAll('span').forEach((sp, i) => { sp.classList.toggle('done', i < stepIdx || finished); sp.classList.toggle('cur', i === stepIdx && !finished); const f = sp.querySelector('i'); if(i !== stepIdx || finished) f.style.width = '0'; });
}
$('#bPlay').onclick = () => { if(finished){ setStep(0); setPlaying(true); return; } setPlaying(!playing); };
$('#bPrev').onclick = () => setStep(stepIdx - 1);
$('#bNext').onclick = () => setStep(stepIdx + 1);
$('#bExit').onclick = stopWorkflow;
document.querySelectorAll('.spd button[data-s]').forEach(b => b.onclick = () => { speed = +b.dataset.s; DEV.arm.st.speed = speed; narr.setRate();
  document.querySelectorAll('.spd button[data-s]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); });
$('#cFollow').onchange = e => { S.follow = e.target.checked; if(S.follow && wf) flyTo(wf.steps[stepIdx].d, true); };

/* info panel */
function select(id){
  S.selected = id; const d = DMAP[id];
  if(id === 'power' && S.mode === 'cutaway') setMode('xray');
  $('#iNum').textContent = pad(d.n); $('#iName').textContent = d.name;
  $('#iCat').innerHTML = `<i style="background:${CATS[d.cat]}"></i>${esc(d.cat)}`;
  const used = id === 'arm' ? WORKFLOWS : WORKFLOWS.filter(w => w.steps.some(s => s.d === id));
  $('#iBody').innerHTML = `<div class="status-row"><i></i>RUNNING · position ${pad(d.n)}</div>
    <p class="lead">${esc(d.intro)}</p>
    <h4>Specifications</h4><dl class="specs">${d.specs.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
    <h4>Capabilities</h4><ul class="caps">${d.caps.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
    <h4>Used in workflows</h4><div class="used">${used.length ? used.map(w => `<button class="chip" data-run="${w.id}">▶ ${esc(w.name)}</button>`).join('') : '<span class="chip">Support system</span>'}</div>`;
  document.body.classList.remove('zen'); $('#bZen').setAttribute('aria-pressed', 'false');
  $('#info').hidden = false; $('#runbar').classList.toggle('lifted', false);
  updateSelBox(); flyTo(id); syncLabels();
  if(leftTab === 'eq') renderLeft();
}
function closeInfo(){ S.selected = null; $('#info').hidden = true; updateSelBox(); syncLabels(); if(leftTab === 'eq') renderLeft(); }
$('#iClose').onclick = closeInfo;
$('#iBody').addEventListener('click', e => { const r = e.target.closest('[data-run]'); if(r){ leftTab = 'wf'; if(narrow()) closeInfo(); startWorkflow(r.dataset.run); } });
function toggleZen(){ const on = document.body.classList.toggle('zen'); $('#bZen').setAttribute('aria-pressed', String(on)); $('#bZen').textContent = on ? 'Show panels' : 'Hide panels'; }
$('#bZen').onclick = toggleZen;
window.addEventListener('keydown', e => { if((e.key === 'v' || e.key === 'V') && wf && !e.metaKey && !e.ctrlKey) setVoice({off:'en', en:'zh', zh:'off'}[narr.lang]); if((e.key === 'h' || e.key === 'H') && !e.metaKey && !e.ctrlKey && !/INPUT|TEXTAREA/.test(e.target.tagName)) toggleZen(); if(e.key === 'Escape'){ if(!$('#info').hidden) closeInfo(); else if(wf) stopWorkflow(); } if(e.key === ' ' && wf && e.target === document.body){ e.preventDefault(); $('#bPlay').click(); } });

/* top bar */
$('#mCut').onclick = () => setMode('cutaway');
$('#mX').onclick = () => setMode('xray');
$('#mExt').onclick = () => setMode('exterior');
$('#bLabels').onclick = e => { const on = document.body.classList.toggle('nolabels'); e.currentTarget.setAttribute('aria-pressed', String(!on)); };
$('#bSpin').onclick = e => { controls.autoRotate = !controls.autoRotate; e.currentTarget.setAttribute('aria-pressed', String(controls.autoRotate)); };
$('#bReset').onclick = () => tweenTo(home().t, home().p, 1.2);

/* labels */
const labelsEl = $('#labels');
const LBL = {};
DEVICES.forEach(d => {
  const el = document.createElement('button'); el.className = 'lbl'; el.type = 'button';
  el.innerHTML = `<b>${pad(d.n)}</b><span>${esc(d.name)}</span>`; el.setAttribute('aria-label', d.name);
  el.addEventListener('click', () => select(d.id));
  el.addEventListener('mouseenter', () => { S.hover = d.id; }); el.addEventListener('mouseleave', () => { if(S.hover === d.id) S.hover = null; });
  labelsEl.appendChild(el); LBL[d.id] = el;
});
function syncLabels(){
  const cur = wf ? wf.steps[stepIdx].d : null;
  DEVICES.forEach(d => { const el = LBL[d.id];
    el.classList.toggle('on', S.selected === d.id); el.classList.toggle('cur', cur === d.id);
    el.classList.toggle('dim', !!(wfDevs && !wfDevs.has(d.id))); });
}
function placeLabels(){
  const w = sceneEl.clientWidth, h = sceneEl.clientHeight;
  const dist = camera.position.distanceTo(controls.target);
  const compact = dist > 7.5 || narrow();
  DEVICES.forEach(d => { const el = LBL[d.id];
    const vis = true;
    _v.copy(anchorW(d.id)).project(camera);
    if(!vis || _v.z > 1 || _v.x < -1.1 || _v.x > 1.1 || _v.y < -1.1 || _v.y > 1.1){ el.style.visibility = 'hidden'; return; }
    el.style.visibility = 'visible';
    el.style.transform = `translate(${((_v.x + 1)/2*w).toFixed(1)}px, ${((1 - _v.y)/2*h).toFixed(1)}px) translate(-50%, -50%)`;
    el.classList.toggle('compact', compact);
    el.style.zIndex = String(1000 - Math.round(_v.z*1000));
  });
}

/* picking */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const pickables = [shellG, ...devGroups];
const isVis = o => { while(o){ if(!o.visible) return false; o = o.parent; } return true; };
function pick(cx, cy){
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((cx - r.left)/r.width)*2 - 1, -((cy - r.top)/r.height)*2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pickables, true);
  for(const h of hits){
    const o = h.object; if(!isVis(o)) continue;
    if(o.userData.shell){ if(S.mode === 'xray') continue; return null; }
    const id = o.userData.devId; if(!id) continue;
    if(DEV[id].dim) continue;
    return id;
  }
  return null;
}
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = {x:e.clientX, y:e.clientY, t:performance.now()}; });
renderer.domElement.addEventListener('pointerup', e => {
  if(!down) return; const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); const quick = performance.now() - down.t < 600; down = null;
  if(moved > 6 || !quick) return;
  const id = pick(e.clientX, e.clientY);
  if(id) select(id); else if(S.selected) closeInfo();
});
let hoverPending = false, lastMove = null;
renderer.domElement.addEventListener('pointermove', e => {
  if(e.pointerType !== 'mouse') return; lastMove = e;
  if(hoverPending) return; hoverPending = true;
  requestAnimationFrame(() => { hoverPending = false; if(down && Math.hypot(lastMove.clientX - down.x, lastMove.clientY - down.y) > 6) return;
    const id = pick(lastMove.clientX, lastMove.clientY); S.hover = id; renderer.domElement.style.cursor = id ? 'pointer' : 'grab'; });
});
renderer.domElement.addEventListener('pointerleave', () => { S.hover = null; });

/* resize */
function resize(){ const w = sceneEl.clientWidth || window.innerWidth, h = sceneEl.clientHeight || window.innerHeight;
  renderer.setSize(w, h); camera.aspect = w/h; camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize); resize();

/* idle arm behaviour */
const IDLE = ['extract','lh','tc','dpcr','srseq','centrifuge','incubator','frag','lcms'];
let idleT = 0;
function idleArm(dt){
  if(wf) return; idleT -= dt; if(idleT > 0) return; idleT = 5.5;
  const id = IDLE[Math.floor(Math.random()*IDLE.length)]; const p = DEV[id].g.position;
  DEV.arm.setTarget(p.x, p.z < 0 ? -1 : 1, Math.random() > 0.4);
}

/* =========================================================
   LOOP
   ========================================================= */
const clock = new THREE.Clock(); let scrAcc = 0, T = 0;
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
setMode('cutaway'); renderLeft(); syncLabels();
function frame(){
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05); T += reduce ? dt*0.35 : dt;
  if(tw){ const k = clamp((performance.now() - tw.t0)/tw.dur, 0, 1); const e = 1 - Math.pow(1 - k, 3);
    controls.target.lerpVectors(tw.fT, tw.tT, e); camera.position.lerpVectors(tw.fP, tw.tP, e); if(k >= 1) tw = null; }
  updateViewOffset(dt);
  controls.update();
  if(S.mode === 'cutaway'){ const cp = camera.position;
    SH.near.visible = cp.z < 0.2; SH.far.visible = cp.z > -0.2; SH.rear.visible = cp.x > -4.7; SH.bulk.visible = cp.x < 3.1; SH.roofF.visible = true; SH.cab.visible = true; }
  DEVICES.forEach(d => { const b = DEV[d.id]; if(b.update) b.update(T, reduce ? dt*0.35 : dt); });
  idleArm(dt); tickWorkflow(dt, T);
  scrAcc += dt; if(scrAcc > 0.1){ scrAcc = 0; screens.forEach(s => { s.draw(s.ctx, T, s.w, s.h); s.tex.needsUpdate = true; }); }
  applyGlow(T);
  renderer.render(scene, camera);
  placeLabels();
}
frame();
const ld = document.getElementById('loading'); ld.style.opacity = '0'; setTimeout(() => ld.remove(), 450);
})();
</script>
